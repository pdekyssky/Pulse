  # ==========================================
  # NEW EXPRESS BACKEND
  # ==========================================

  express:
    build:
      context: ./backend/express
    container_name: pulse-express
    restart: unless-stopped
    env_file:
      - ./backend/express/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/express:/app
      - /app/node_modules


  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build:
      context: ./frontend
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - express


