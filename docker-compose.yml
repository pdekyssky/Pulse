services:

  # ==========================================
  # NOTIFICATION SERVICE
  # Ports 5001-5004 are published for local
  # debugging only. The frontend talks to the
  # gateway on :5000.
  # ==========================================

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: pulse-notification
    restart: unless-stopped
    env_file:
      - ./backend/notification-service/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend/notification-service:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5001)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  user-service:
    build:
      context: ./backend/user-service
    container_name: pulse-user
    restart: unless-stopped
    env_file:
      - ./backend/user-service/.env
    environment:
      INCIDENT_SERVICE_URL: http://incident-service:5003
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    ports:
      - "5002:5002"
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5002)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  incident-service:
    build:
      context: ./backend/incident-service
    container_name: pulse-incident
    restart: unless-stopped
    env_file:
      - ./backend/incident-service/.env
    environment:
      USER_SERVICE_URL: http://user-service:5002
      ALERT_SERVICE_URL: http://alert-service:5004
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    ports:
      - "5003:5003"
    volumes:
      - ./backend/incident-service:/app
      - /app/node_modules
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5003)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  alert-service:
    build:
      context: ./backend/alert-service
    container_name: pulse-alert
    restart: unless-stopped
    env_file:
      - ./backend/alert-service/.env
    environment:
      INCIDENT_SERVICE_URL: http://incident-service:5003
    ports:
      - "5004:5004"
    volumes:
      - ./backend/alert-service:/app
      - /app/node_modules
    depends_on:
      incident-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5004)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: ./backend/gateway
    container_name: pulse-gateway
    restart: unless-stopped
    env_file:
      - ./backend/gateway/.env
    environment:
      USER_SERVICE_URL: http://user-service:5002
      INCIDENT_SERVICE_URL: http://incident-service:5003
      ALERT_SERVICE_URL: http://alert-service:5004
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    ports:
      - "5000:5000"
    volumes:
      - ./backend/gateway:/app
      - /app/node_modules
    depends_on:
      user-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      gateway:
        condition: service_healthy
